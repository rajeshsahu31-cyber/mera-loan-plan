<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Debt Freedom</title><link rel="stylesheet" href="assets/style.css"></head><body><main class="wrap"><header class="top"><h1>🎯 Debt Freedom Plan</h1><p>बचे हुए पैसे से loan planning</p></header><nav class="nav"><a href="index.html">🏠 Dashboard</a><a href="loans.html">🏦 My Loans</a><a href="income.html">💵 Income & Expense</a><a class="active" href="plan.html">🎯 Debt Freedom</a><a href="investment.html">📈 Savings</a></nav><section class="section" id="plan"></section></main><script src="assets/app.js"></script><script>const s=LP.load(),sur=LP.surplus(s),close=LP.closeTotal(s),emi=LP.emiTotal(s);document.getElementById('plan').innerHTML=`<h2>आपकी उपलब्ध क्षमता</h2><div class="summary"><div>मासिक बचत<strong>${LP.money(sur)}</strong></div><div>कुल EMI<strong>${LP.money(emi)}</strong></div><div>Final Foreclosure Total<strong>${LP.money(close)}</strong></div></div><div class="section"><h2>💡 अतिरिक्त भुगतान का illustrative scenario</h2><p>यदि आप हर महीने ${LP.money(Math.max(0,sur))} अतिरिक्त loan में लगाते हैं, तो app आगे loan payoff scenarios दिखाने के लिए तैयार है। वास्तविक interest saving बैंक की terms और payment dates पर निर्भर करेगी।</p></div>`;</script></body></html>
