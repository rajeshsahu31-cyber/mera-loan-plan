<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Debt Freedom Plan • मेरा Loan Plan</title><link rel="stylesheet" href="assets/style.css?v=3"></head><body><main class="wrap"><header class="top"><h1>🎯 Debt Freedom Plan</h1><p>बचे हुए पैसे से loan planning</p></header><section class="freedom" id="planHero"></section><section class="section"><h2>💡 आपकी Planning Capacity</h2><div class="plan-stats"><div class="plan-stat"><small>मासिक बचत</small><strong id="saving">₹0</strong></div><div class="plan-stat"><small>कुल EMI</small><strong id="emi">₹0</strong></div><div class="plan-stat"><small>Loan में Extra देने की क्षमता</small><strong id="extra">₹0</strong></div></div></section><div class="tip">🔥 <b>ध्यान दें:</b> Extra payment का वास्तविक असर interest rate, foreclosure charges और bank की payment terms पर निर्भर करेगा।</div></main><nav class="bottom-nav" aria-label="मुख्य नेविगेशन"><a href="index.html"><span class="ico">🏠</span>Home</a><a href="loans.html"><span class="ico">🏦</span>Loans</a><a href="income.html"><span class="ico">💰</span>Income</a><a class="active" href="plan.html"><span class="ico">🎯</span>Plan</a><a href="investment.html"><span class="ico">📈</span>Savings</a></nav><script src="assets/app.js?v=3"></script><script>const s=LP.load(),close=LP.closeTotal(s),saving=Math.max(0,LP.surplus(s)),emi=LP.emiTotal(s),months=saving>0&&close>0?Math.ceil(close/saving):0;const d=new Date();if(months)d.setMonth(d.getMonth()+months);const date=months?d.toLocaleDateString('hi-IN',{month:'long',year:'numeric'}):'अभी तय नहीं';document.getElementById('saving').textContent=LP.money(saving);document.getElementById('emi').textContent=LP.money(emi);document.getElementById('extra').textContent=LP.money(saving);document.getElementById('planHero').innerHTML=`<div class="freedom-head"><div class="freedom-title">🎯 Loan Free Plan</div><span class="goal-pill">सभी Loan से मुक्ति</span></div><div class="freedom-grid"><div class="freedom-stat"><small>Final Foreclosure Total</small><strong>${LP.money(close)}</strong><small style="margin-top:7px">अनुमानित Loan-Free Date</small><strong>${date}</strong></div><div class="freedom-stat"><div class="progress-label"><span>आज से Loan Free Progress</span><span>${close?Math.round(Math.min(100,(saving/close)*100)):0}%</span></div><div class="progress"><i style="width:${close?Math.min(100,(saving/close)*100):0}%"></i></div><div class="freedom-foot"><span>आज ${LP.money(close)}</span><span>बाकी ${LP.money(Math.max(0,close-saving))}</span><span>₹0 Loan Free</span></div></div></div>`;</script></body></html>
