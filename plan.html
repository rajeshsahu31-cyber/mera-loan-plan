</nav><script src="assets/app.js"></script><script>const s=LP.load(),sur=LP.surplus(s),close=LP.closeTotal(s),emi=LP.emiTotal(s);const months=sur>0&&close>0?Math.ceil(close/sur):0;const d=new Date();if(months)d.setMonth(d.getMonth()+months);const dateText=months?d.toLocaleDateString('hi-IN',{month:'long',year:'numeric'}):'अभी तय नहीं';document.getElementById('plan').innerHTML=`<div class="freedom-head"><div class="freedom-title">🎯 Loan Free Plan</div><span class="goal-pill">सभी Loan से मुक्ति</span></div><div class="freedom-grid"><div class="freedom-stat"><small>Final Foreclosure Total</small><strong>${LP.money(close)}</strong></div><div class="freedom-stat"><small>अनुमानित Loan-Free Date</small><strong>${dateText}</strong></div></div><div class="freedom-stat" style="margin-top:8px"><div class="progress-label"><span>आज से Loan Free Progress</span><span>${close?Math.max(0,Math.min(100,Math.round((sur/close)*100))):0}%</span></div><div class="progress"><i style="width:${close?Math.max(0,Math.min(100,(sur/close)*100)):0}%"></i></div></div>`;document.getElementById('capacity').innerHTML=`<div class="summary"><div>मासिक बचत<strong>${LP.money(Math.max(0,sur))}</strong></div><div>कुल EMI<strong>${LP.money(emi)}</strong></div><div>Loan में Extra देने की क्षमता<strong>${LP.money(Math.max(0,sur))}</strong></div></div>`;</script></body></html>
