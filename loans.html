<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Loans • मेरा Loan Plan</title><link rel="stylesheet" href="assets/style.css?v=7"></head><body><main class="wrap"><header class="top"><h1>🏦 My Loans</h1><p>जितने चाहें Loan जोड़ें • एक-एक करके विस्तार देखें</p></header><section class="section"><button class="add-loan-top" id="toggleForm">➕ Add Another Loan <span id="toggleIcon">＋</span></button><div class="collapsible" id="formBox"><form id="form"><div class="grid"><div class="field"><label>Loan Type</label><select id="type"><option value="Bank Loan">🏦 Bank Loan</option><option value="Personal Loan">👤 Personal Loan</option><option value="Home Loan">🏠 Home Loan</option><option value="Car Loan">🚗 Car Loan</option><option value="Gold Loan">🪙 Gold Loan</option><option value="Consumer Loan">🛒 Consumer Loan</option><option value="Mobile/Device Loan">📱 Mobile/Device Loan</option><option value="App Loan">📲 App Loan</option><option value="Education Loan">🎓 Education Loan</option><option value="Business Loan">💼 Business Loan</option><option value="Vehicle Loan">🛵 Vehicle Loan</option><option value="Other">✏️ Other</option></select></div><div class="field"><label>Bank / App / Loan Name</label><input id="name" required placeholder="जैसे SBI"></div><div class="field"><label>Loan Account / Reference</label><input id="account" placeholder="Optional"></div><div class="field"><label>App/Calculation Balance</label><input id="balance" type="number" min="0" required placeholder="₹"></div><div class="field"><label>🏦 Bank Actual Remaining Balance</label><input id="actual" type="number" min="0" placeholder="Bank app से देखकर भरें"></div><div class="field"><label>Monthly EMI / Payment</label><input id="emi" type="number" min="0" required placeholder="₹"></div><div class="field"><label>Remaining Months</label><input id="months" type="number" min="0" placeholder="महीने"></div><div class="field"><label>Annual Interest %</label><input id="rate" type="number" min="0" step="0.01" placeholder="जैसे 12"></div><div class="field"><label>Loan Start Date</label><input id="startDate" type="date"></div><div class="field"><label>Expected Loan End Date</label><input id="endDate" type="date"></div><div class="field"><label>EMI Due Day (हर माह)</label><input id="emiDueDay" type="number" min="1" max="31" placeholder="जैसे 5"></div><div class="field"><label>Last Actual Payment Date</label><input id="lastPaymentDate" type="date"></div><div class="field full"><label>🔔 Reminder</label><label class="switch-row"><input id="reminder" type="checkbox"><span>Due date reminder दिखाएँ</span></label></div></div><div class="actions"><button class="btn" type="submit">💾 Loan Save करें</button><button class="icon-btn" type="button" id="cancelEdit">✖️</button></div></form></div></section><div class="list-title"><h2>📋 आपके सभी Loan</h2><span class="badge" id="loanCount">0 Loan</span></div><div id="list"></div><p class="note">🧮 Actual Bank Balance दर्ज होते ही अनुमानित balance हटकर वही planning का आधार बनता है।</p></main><nav class="bottom-nav"><a href="index.html"><span class="ico">🏠</span>Home</a><a class="active" href="loans.html"><span class="ico">🏦</span>Loans</a><a href="income.html"><span class="ico">💰</span>Income</a><a href="plan.html"><span class="ico">🎯</span>Plan</a><a href="investment.html"><span class="ico">📈</span>Savings</a></nav><script src="assets/app.js?v=7"></script><script>
let s=LP.load(),editingId=null,editingKey=null;const form=document.getElementById('form'),box=document.getElementById('formBox');
function openForm(){box.classList.add('open');document.getElementById('toggleIcon').textContent='−'}
document.getElementById('toggleForm').onclick=()=>{box.classList.toggle('open');document.getElementById('toggleIcon').textContent=box.classList.contains('open')?'−':'＋'};
document.getElementById('cancelEdit').onclick=()=>{editingId=null;editingKey=null;form.reset();box.classList.remove('open');document.getElementById('toggleIcon').textContent='＋'};
function arr(k){return s[k]}
function fill(x){form.type.value=x.loanType||'Bank Loan';form.name.value=x.name||'';form.account.value=x.account||'';form.balance.value=x.balance||'';form.actual.value=x.bankActualBalance||x.actualForeclosure||'';form.emi.value=x.emi||'';form.months.value=x.months||'';form.rate.value=x.rate||'';form.startDate.value=x.startDate||'';form.endDate.value=x.endDate||'';form.emiDueDay.value=x.emiDueDay||'';form.lastPaymentDate.value=x.lastPaymentDate||'';form.reminder.checked=!!x.reminder}
function render(){const list=document.getElementById('list'),items=LP.loans(s);document.getElementById('loanCount').textContent=items.length+' Loan';list.innerHTML=items.length?items.map(LP.loanCard).join(''):'<div class="section empty">अभी कोई loan नहीं जोड़ा गया है। ऊपर ➕ Add Another Loan दबाएँ।</div>';list.querySelectorAll('.del').forEach(b=>b.onclick=()=>{const a=arr(b.dataset.key),i=a.findIndex(z=>z.id===b.dataset.id);if(i<0)return;if(!confirm('यह Loan हटाना है?'))return;a.splice(i,1);LP.save(s);s=LP.load();render()});list.querySelectorAll('.pay-btn').forEach(b=>b.onclick=()=>{const card=b.closest('.loan-card');const amount=LP.num(card.querySelector('.pay-amount').value);const date=card.querySelector('.pay-date').value||new Date().toISOString().slice(0,10);if(!amount)return;const a=arr(b.dataset.key),x=a.find(z=>z.id===b.dataset.id);if(!x)return;const base=LP.actualBalance(x)>0?LP.actualBalance(x):LP.current(x);const newBal=Math.max(0,base-amount);if(LP.actualBalance(x)>0)x.bankActualBalance=newBal;else x.balance=newBal;x.lastPaymentDate=date;x.lastPaymentAmount=amount;x.paymentHistory=Array.isArray(x.paymentHistory)?x.paymentHistory:[];x.paymentHistory.push({amount,date});LP.save(s);s=LP.load();render()});list.querySelectorAll('.edit').forEach(b=>b.onclick=()=>{const x=arr(b.dataset.key).find(z=>z.id===b.dataset.id);if(!x)return;editingId=x.id;editingKey=b.dataset.key;fill(x);openForm();window.scrollTo({top:0,behavior:'smooth'})})}
form.onsubmit=e=>{e.preventDefault();const type=form.type.value;let key=(type==='Bank Loan'||type==='Home Loan'||type==='Car Loan'||type==='Gold Loan'||type==='Personal Loan'||type==='Education Loan'||type==='Business Loan'||type==='Vehicle Loan'||type==='Consumer Loan'||type==='Other'||type==='Mobile/Device Loan')?'banks':type==='App Loan'?'apps':'others';const actual=LP.num(form.actual.value);const obj={id:editingId||LP.id(),loanType:type,name:form.name.value.trim(),account:form.account.value.trim(),balance:LP.num(form.balance.value),bankActualBalance:actual,actualForeclosure:actual,emi:LP.num(form.emi.value),months:LP.num(form.months.value),rate:LP.num(form.rate.value),startDate:form.startDate.value,endDate:form.endDate.value,emiDueDay:LP.num(form.emiDueDay.value),lastPaymentDate:form.lastPaymentDate.value,reminder:form.reminder.checked};if(editingId&&editingKey===key){const a=arr(key),i=a.findIndex(x=>x.id===editingId);if(i>=0)a[i]=obj}else{if(editingId&&editingKey!==key){const old=arr(editingKey),i=old.findIndex(x=>x.id===editingId);if(i>=0)old.splice(i,1)}arr(key).push(obj)}LP.save(s);s=LP.load();editingId=null;editingKey=null;form.reset();box.classList.remove('open');document.getElementById('toggleIcon').textContent='＋';render()};render();
</script></body></html>
