<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Income & Expense • मेरा Loan Plan</title><link rel="stylesheet" href="assets/style.css?v=3"></head><body><main class="wrap"><header class="top"><h1>💰 Income & Expense</h1><p>मासिक आय और खर्च व्यवस्थित करें</p></header><section class="section"><button class="toggle" id="incToggle">💵 आय जोड़ें <span>＋</span></button><div class="collapsible" id="incBox"><form id="inc"><div class="grid"><div class="field"><label>आय का नाम</label><input id="inname" required placeholder="Salary"></div><div class="field"><label>मासिक राशि</label><input id="inamount" type="number" min="0" required placeholder="₹"></div></div><div class="actions"><button class="btn">➕ आय Save करें</button></div></form></div></section><section class="section"><button class="toggle" id="expToggle">🛒 खर्च जोड़ें <span>＋</span></button><div class="collapsible" id="expBox"><form id="exp"><div class="grid"><div class="field"><label>खर्च का नाम</label><input id="exname" required placeholder="किराया"></div><div class="field"><label>मासिक राशि</label><input id="examount" type="number" min="0" required placeholder="₹"></div></div><div class="actions"><button class="btn">➕ खर्च Save करें</button></div></form></div></section><section class="section"><h2>📊 इस महीने का सारांश</h2><div id="summary"></div></section><section class="section"><h2>📋 दर्ज आय / खर्च</h2><div id="entries"></div></section></main><nav class="bottom-nav" aria-label="मुख्य नेविगेशन"><a href="index.html"><span class="ico">🏠</span>Home</a><a href="loans.html"><span class="ico">🏦</span>Loans</a><a class="active" href="income.html"><span class="ico">💰</span>Income</a><a href="plan.html"><span class="ico">🎯</span>Plan</a><a href="investment.html"><span class="ico">📈</span>Savings</a></nav><script src="assets/app.js?v=3"></script><script>let s=LP.load();const incBox=document.getElementById('incBox'),expBox=document.getElementById('expBox');document.getElementById('incToggle').onclick=()=>{incBox.classList.toggle('open');expBox.classList.remove('open')};document.getElementById('expToggle').onclick=()=>{expBox.classList.toggle('open');incBox.classList.remove('open')};function render(){document.getElementById('summary').innerHTML=`<div class="summary"><div>💰 कुल आय<strong>${LP.money(LP.incomeTotal(s))}</strong></div><div>💸 खर्च + EMI<strong>${LP.money(LP.expenseTotal(s))}</strong></div><div>💚 मासिक बचत<strong>${LP.money(LP.surplus(s))}</strong></div></div>`;const income=s.income.map(x=>`<div class="option-card">💵 ${LP.esc(x.name)} <b>${LP.money(x.amount)}</b></div>`).join('');const expense=s.expenses.map(x=>`<div class="option-card">🛒 ${LP.esc(x.name)} <b>${LP.money(x.amount)}</b></div>`).join('');document.getElementById('entries').innerHTML=(income+expense)||'<div class="empty">अभी कोई entry नहीं है।</div>'}document.getElementById('inc').onsubmit=e=>{e.preventDefault();s.income.push({id:LP.id(),name:inname.value.trim(),amount:LP.num(inamount.value)});LP.save(s);s=LP.load();e.target.reset();incBox.classList.remove('open');render()};document.getElementById('exp').onsubmit=e=>{e.preventDefault();s.expenses.push({id:LP.id(),name:exname.value.trim(),amount:LP.num(examount.value)});LP.save(s);s=LP.load();e.target.reset();expBox.classList.remove('open');render()};render();</script></body></html>
