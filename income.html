<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Income & Expense</title><link rel="stylesheet" href="assets/style.css"></head><body><main class="wrap"><header class="top"><h1>💵 Income & Expense</h1><p>मासिक आय और खर्च व्यवस्थित करें</p></header><nav class="nav"><a href="index.html">🏠 Dashboard</a><a href="loans.html">🏦 My Loans</a><a class="active" href="income.html">💵 Income & Expense</a><a href="plan.html">🎯 Debt Freedom</a><a href="investment.html">📈 Savings</a></nav><section class="section"><h2>💰 आय जोड़ें</h2><form id="inc"><div class="grid"><div class="field"><label>आय का नाम</label><input id="inname" required placeholder="Salary"></div><div class="field"><label>मासिक राशि</label><input id="inamount" type="number" min="0" required></div></div><div class="actions"><button class="btn">➕ आय Save करें</button></div></form></section><section class="section"><h2>🛒 खर्च जोड़ें</h2><form id="exp"><div class="grid"><div class="field"><label>खर्च का नाम</label><input id="exname" required placeholder="किराया"></div><div class="field"><label>मासिक राशि</label><input id="examount" type="number" min="0" required></div></div><div class="actions"><button class="btn">➕ खर्च Save करें</button></div></form></section><section class="section"><h2>📊 सारांश</h2><div id="summary"></div></section></main><script src="assets/app.js"></script><script>let s=LP.load();function render(){document.getElementById('summary').innerHTML=`<div class="summary"><div>कुल आय<strong>${LP.money(LP.incomeTotal(s))}</strong></div><div>खर्च + EMI<strong>${LP.money(LP.expenseTotal(s))}</strong></div><div>मासिक बचत<strong>${LP.money(LP.surplus(s))}</strong></div></div>`}document.getElementById('inc').onsubmit=e=>{e.preventDefault();s.income.push({id:LP.id(),name:inname.value,amount:LP.num(inamount.value)});LP.save(s);s=LP.load();e.target.reset();render()};document.getElementById('exp').onsubmit=e=>{e.preventDefault();s.expenses.push({id:LP.id(),name:exname.value,amount:LP.num(examount.value)});LP.save(s);s=LP.load();e.target.reset();render()};render();</script></body></html>
