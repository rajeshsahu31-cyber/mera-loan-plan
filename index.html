<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>मेरा Loan Plan</title><link rel="stylesheet" href="assets/style.css?v=7"></head><body><main class="wrap dashboard-page"><header class="top"><h1>💠 मेरा Loan Plan</h1><p>आपका पैसा • आपका Plan • आपका निर्णय</p></header><section class="dash" id="dash"></section><div class="dash-bottom"><section class="compact-section"><h2>📌 वर्तमान स्थिति</h2><div id="status"></div></section><section class="compact-section"><h2>🔎 आज बंद करें बनाम EMI</h2><div id="comparison"></div></section></div><section class="section surplus-section"><div class="section-head"><h2>💰 इस महीने उपलब्ध रकम</h2><span class="micro">आप खुद तय करें</span></div><div id="surplusWheel"></div></section><section class="freedom compact-freedom" id="freedom"></section><div class="tip" id="tip"></div></main><nav class="bottom-nav"><a class="active" href="index.html"><span class="ico">🏠</span>Home</a><a href="loans.html"><span class="ico">🏦</span>Loans</a><a href="income.html"><span class="ico">💰</span>Income</a><a href="plan.html"><span class="ico">🎯</span>Plan</a><a href="investment.html"><span class="ico">📈</span>Savings</a></nav><script src="assets/app.js?v=7"></script><script>
(function(){
 function render(){const s=LP.load(),items=LP.loans(s),close=LP.closeTotal(s),monthly=Math.max(0,LP.surplus(s));
 const cards=[['t1','💰 कुल बाकी Loan',close],['t2','💳 कुल EMI / माह',LP.emiTotal(s)],['t3','🔐 आज बंद करें',LP.closeTotal(s)],['t4','📅 EMI से कुल भुगतान',LP.futureTotal(s)]];
 document.getElementById('dash').innerHTML=cards.map(x=>`<div class="tile ${x[0]}"><small>${x[1]}</small><strong>${LP.money(x[2])}</strong></div>`).join('');
 document.getElementById('status').innerHTML=`<div class="summary compact-summary"><div>💰 आय<strong>${LP.money(LP.incomeTotal(s))}</strong></div><div>💸 खर्च + EMI<strong>${LP.money(LP.expenseTotal(s))}</strong></div><div>💚 बचत<strong>${LP.money(monthly)}</strong></div></div>`;
 const diff=Math.max(0,LP.futureTotal(s)-LP.closeTotal(s)); document.getElementById('comparison').innerHTML=`<div class="summary compact-summary"><div>🔐 आज<strong>${LP.money(LP.closeTotal(s))}</strong></div><div>📅 EMI<strong>${LP.money(LP.futureTotal(s))}</strong></div><div>💡 अंतर<strong>${LP.money(diff)}</strong></div></div>`;
 const alloc={emergency:num(s.settings.emergencyFund),loan:num(s.settings.surplusLoanAmount)}; const used=alloc.emergency+alloc.loan; const left=Math.max(0,monthly-used); const loanTarget=items.find(x=>x.id===s.settings.surplusLoanId);
 document.getElementById('surplusWheel').innerHTML=`<div class="money-wheel"><div class="wheel-center"><span>उपलब्ध</span><b>${LP.money(monthly)}</b><small>इस महीने</small></div><div class="wheel-options"><label class="wheel-item emergency"><span>🛟</span><b>Emergency Fund</b><input id="emergencyAlloc" type="number" min="0" max="${monthly}" value="${alloc.emergency||''}" placeholder="₹"></label><label class="wheel-item loan"><span>🏦</span><b>${loanTarget?LP.esc(loanTarget.name):'Loan में डालें'}</b><select id="loanTarget"><option value="">Loan चुनें</option>${items.map(x=>`<option value="${x.id}" ${loanTarget&&loanTarget.id===x.id?'selected':''}>${LP.esc(x.name)} • ${LP.money(LP.selected(x))}</option>`).join('')}</select><input id="loanAlloc" type="number" min="0" max="${monthly}" value="${alloc.loan||''}" placeholder="₹"></label></div><div class="allocation-result"><span>🧮 बाँटी गई <b>${LP.money(used)}</b></span><span>💚 बाकी <b>${LP.money(left)}</b></span></div></div>`;
 const saveAlloc=()=>{s.settings.emergencyFund=LP.num(document.getElementById('emergencyAlloc').value);s.settings.surplusLoanId=document.getElementById('loanTarget').value;s.settings.surplusLoanAmount=LP.num(document.getElementById('loanAlloc').value);LP.save(s);render()};
 ['emergencyAlloc','loanAlloc','loanTarget'].forEach(id=>document.getElementById(id).addEventListener('change',saveAlloc));
 let activeLoan=loanTarget, payoff=''; if(activeLoan&&alloc.loan>0){const d=LP.calcLoanPayoffDate(activeLoan,alloc.loan); payoff=d?`लगभग ${LP.dateText(d)} तक`:'EMI/interest के आधार पर अनुमान उपलब्ध नहीं';}
 const totalMonths=monthly>0&&close>0?Math.ceil(close/monthly):0; const d=new Date(); if(totalMonths)d.setMonth(d.getMonth()+totalMonths);
 document.getElementById('freedom').innerHTML=`<div class="freedom-head"><div class="freedom-title">🎯 Debt Freedom Snapshot</div><span class="goal-pill">What-if • आपकी choice</span></div><div class="roadmap-mini">${items.length?items.slice(0,4).map(x=>`<div><span>🏦 ${LP.esc(x.name)}</span><b>${LP.dateText(LP.endDate(x))}</b></div>`).join(''):'<div class="empty">पहले Loan जोड़ें</div>'}</div><div class="freedom-inline"><span>💚 बचत से अनुमानित मुक्ति: <b>${totalMonths?LP.dateText(d):'—'}</b></span><span>🎯 चुने Loan का असर: <b>${payoff||'Loan चुनें'}</b></span></div>`;
 document.getElementById('tip').innerHTML=`💡 यह planner केवल विकल्प दिखाता है। आप चाहें तो बची रकम Emergency Fund में रखें, किसी एक Loan में डालें, या दोनों में बाँटें। जो वास्तविक payment करें, उसे Loan page में दर्ज करें ताकि app और वास्तविक स्थिति match रहे।`;
 }
 function num(v){const n=Number(v);return Number.isFinite(n)&&n>0?n:0} render();window.addEventListener('pageshow',render);
})();</script></body></html>
