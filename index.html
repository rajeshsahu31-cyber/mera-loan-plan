<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>मेरा Loan Plan</title><link rel="stylesheet" href="assets/style.css"></head><body><main class="wrap"><header class="top"><h1>💠 मेरा Loan Plan</h1><p>Loan • Income • Expense • Debt Freedom</p></header><section class="dash" id="dash"></section><div class="dash-bottom"><section class="compact-section"><h2>📌 वर्तमान स्थिति</h2><div id="status"></div></section><section class="compact-section"><h2>🔎 बंद करें बनाम EMI</h2><div id="comparison"></div></section></div><section class="freedom" id="freedom"></section><div class="tip" id="tip"></div></main><nav class="bottom-nav" aria-label="मुख्य नेविगेशन">
<a class="active" href="index.html"><span class="ico">🏠</span>Home</a>
<a class="" href="loans.html"><span class="ico">🏦</span>Loans</a>
<a class="" href="income.html"><span class="ico">💰</span>Income</a>
<a class="" href="plan.html"><span class="ico">🎯</span>Plan</a>
<a class="" href="investment.html"><span class="ico">📈</span>Savings</a>
</nav><script src="assets/app.js"></script><script>
(function(){function render(){const s=LP.load(),d=document.getElementById('dash');const cards=[['t1','💰 कुल Current Balance',LP.currentTotal(s)],['t2','💳 कुल EMI / माह',LP.emiTotal(s)],['t3','🔐 आज सभी Loan बंद करें',LP.closeTotal(s)],['t4','📅 EMI से आगे कुल भुगतान',LP.futureTotal(s)]];d.innerHTML=cards.map(x=>`<div class="tile ${x[0]}"><small>${x[1]}</small><strong>${LP.money(x[2])}</strong></div>`).join('');const surplus=LP.surplus(s);document.getElementById('status').innerHTML=`<div class="summary"><div>मासिक आय<strong>${LP.money(LP.incomeTotal(s))}</strong></div><div>मासिक खर्च + EMI<strong>${LP.money(LP.expenseTotal(s))}</strong></div><div>मासिक बचत<strong>${LP.money(surplus)}</strong></div></div>`;const diff=LP.futureTotal(s)-LP.closeTotal(s);document.getElementById('comparison').innerHTML=`<div class="summary"><div>🔐 आज बंद करें<strong>${LP.money(LP.closeTotal(s))}</strong></div><div>📅 EMI जारी रखें<strong>${LP.money(LP.futureTotal(s))}</strong></div><div>💡 संभावित अंतर<strong>${LP.money(Math.max(0,diff))}</strong></div></div>`;const close=LP.closeTotal(s),paid=Math.max(0,close-surplus),progress=close?Math.max(0,Math.min(100,((close-paid)/close)*100)):0;const months=surplus>0&&close>0?Math.ceil(close/surplus):0;const date=new Date();if(months)date.setMonth(date.getMonth()+months);const dateText=months?date.toLocaleDateString('hi-IN',{month:'long',year:'numeric'}):'अभी तय नहीं';document.getElementById('freedom').innerHTML=`<div class="freedom-head"><div class="freedom-title">🎯 Loan Free Plan</div><span class="goal-pill">लक्ष्य: सभी Loan से मुक्ति</span></div><div class="freedom-grid"><div class="freedom-stat"><small>अनुमानित Loan-Free Date</small><strong>${dateText}</strong></div><div class="freedom-stat"><div class="progress-label"><span>Debt Freedom Progress</span><span>${Math.round(progress)}%</span></div><div class="progress"><i style="width:${progress}%"></i></div><div class="freedom-foot"><span>${LP.money(close)} आज</span><span>${LP.money(Math.max(0,close-paid))} बाकी</span><span>₹0 Loan Free</span></div></div></div>`;document.getElementById('tip').innerHTML=`💡 <b>इस महीने ध्यान दें:</b> आपकी अनुमानित मासिक बचत ${LP.money(Math.max(0,surplus))} है। इसे Loan prepayment में लगाने से payoff planning तेज हो सकती है। वास्तविक ब्याज बचत बैंक की terms पर निर्भर करेगी।`}render();})();
</script></body></html>
