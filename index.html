<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>मेरा Loan Plan</title><link rel="stylesheet" href="assets/style.css"></head><body><main class="wrap"><header class="top"><h1>💠 मेरा Loan Plan</h1><p>Loan • Income • Expense • Debt Freedom</p></header><nav class="nav"><a class="active" href="index.html">🏠 Dashboard</a><a href="loans.html">🏦 My Loans</a><a href="income.html">💵 Income & Expense</a><a href="plan.html">🎯 Debt Freedom</a><a href="investment.html">📈 Savings</a></nav><section class="dash" id="dash"></section><section class="section"><h2>📌 आपकी वर्तमान स्थिति</h2><div id="status"></div></section><section class="section"><h2>🔎 आज बंद करें बनाम EMI जारी रखें</h2><div id="comparison"></div></section><p class="footer">आपके द्वारा चुना गया Final Amount ही “आज सभी Loan बंद करें” में जोड़ा जाता है।</p></main><script src="assets/app.js"></script><script>(function(){function render(){const s=LP.load(),d=document.getElementById('dash');const cards=[['t1','💰 कुल Current Balance',LP.currentTotal(s)],['t2','💳 कुल EMI / माह',LP.emiTotal(s)],['t3','🔐 आज सभी Loan बंद करें',LP.closeTotal(s)],['t4','📅 EMI से आगे कुल भुगतान',LP.futureTotal(s)]];d.innerHTML=cards.map(x=>`<div class="tile ${x[0]}"><small>${x[1]}</small><strong>${LP.money(x[2])}</strong></div>`).join('');const surplus=LP.surplus(s);document.getElementById('status').innerHTML=`<div class="summary"><div>मासिक आय<strong>${LP.money(LP.incomeTotal(s))}</strong></div><div>मासिक खर्च + EMI<strong>${LP.money(LP.expenseTotal(s))}</strong></div><div>मासिक बचत<strong>${LP.money(surplus)}</strong></div></div>`;const diff=LP.futureTotal(s)-LP.closeTotal(s);document.getElementById('comparison').innerHTML=`<div class="summary"><div>🔐 आज बंद करें<strong>${LP.money(LP.closeTotal(s))}</strong></div><div>📅 EMI जारी रखें<strong>${LP.money(LP.futureTotal(s))}</strong></div><div>💡 संभावित अंतर<strong>${LP.money(Math.max(0,diff))}</strong></div></div>`}render();})();</script></body></html>
